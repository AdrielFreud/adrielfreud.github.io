<script>
/* Aparência independente dos dados dos veículos */
(function(){
  try {
    const mode=localStorage.getItem('meu-carro-aparencia') || 'auto';
    if(mode==='light'||mode==='dark') document.documentElement.dataset.theme=mode;
    else document.documentElement.removeAttribute('data-theme');
    document.documentElement.style.colorScheme=mode==='auto'?'light dark':mode;
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.content=(mode==='dark'||(mode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'#0F1216':'#EDEFF2';
  }catch(e){}
})();
function setAppAppearance(mode){
  if(!['auto','light','dark'].includes(mode))return;
  try{localStorage.setItem('meu-carro-aparencia',mode)}catch(e){}
  if(mode==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme=mode;
  document.documentElement.style.colorScheme=mode==='auto'?'light dark':mode;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=(mode==='dark'||(mode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'#0F1216':'#EDEFF2';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{
  try{if((localStorage.getItem('meu-carro-aparencia')||'auto')==='auto')setAppAppearance('auto')}catch(e){}
});
</script>
<style>
/* Layout: sidebar + conteúdo no desktop; barra de abas inferior no celular. Visual de painel de instrumentos: números condensados, odômetro, vareta de óleo. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#F4F5F7; --ink:#171B21; --ink2:#4A5361; --line:#D8DCE2;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --accent-soft:#E2E9F4;
  --ok:#1B7A4D; --ok-soft:#DFF2E8; --ok-bar:#2FA36B;
  --warn:#7F5400; --warn-soft:#FAEFD0; --warn-bar:#D99A0B;
  --urgent:#B23F0F; --urgent-soft:#FCE5D9; --urgent-bar:#E0622B;
  --bad:#B42020; --bad-soft:#FBE0E0; --bad-bar:#D13A3A;
  --oil:#D08A00; --oil2:#F4C95D; --dip-body:#E3E6EB; --dip-line:#8B94A1;
  --dash:#1E232A; --dash-ink:#F2F4F7; --overlay:rgba(12,15,20,.55);
  --f-disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1216; --surface:#171B21; --surface2:#1E232A; --ink:#E8EBF0; --ink2:#9AA4B2; --line:#2B323B;
    --accent:#8FB2E8; --accent-ink:#0F1216; --accent-soft:#1E2A3D;
    --ok:#5FD39B; --ok-soft:#15291F; --ok-bar:#2FA36B;
    --warn:#F0BE55; --warn-soft:#2D2410; --warn-bar:#D99A0B;
    --urgent:#FF9A6B; --urgent-soft:#341D12; --urgent-bar:#E0622B;
    --bad:#FF8484; --bad-soft:#341717; --bad-bar:#D13A3A;
    --oil:#D08A00; --oil2:#F4C95D; --dip-body:#2A313A; --dip-line:#6B7482;
    --dash:#0A0C0F; --dash-ink:#F2F4F7; --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --surface2:#1E232A; --ink:#E8EBF0; --ink2:#9AA4B2; --line:#2B323B;
  --accent:#8FB2E8; --accent-ink:#0F1216; --accent-soft:#1E2A3D;
  --ok:#5FD39B; --ok-soft:#15291F; --ok-bar:#2FA36B;
  --warn:#F0BE55; --warn-soft:#2D2410; --warn-bar:#D99A0B;
  --urgent:#FF9A6B; --urgent-soft:#341D12; --urgent-bar:#E0622B;
  --bad:#FF8484; --bad-soft:#341717; --bad-bar:#D13A3A;
  --oil:#D08A00; --oil2:#F4C95D; --dip-body:#2A313A; --dip-line:#6B7482;
  --dash:#0A0C0F; --dash-ink:#F2F4F7; --overlay:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp);letter-spacing:.01em}



/* Diagnóstico por arquivo CSV do Car Scanner */
.csv-zone{border:2px dashed var(--line);border-radius:14px;padding:18px;background:var(--surface2)}
.csv-zone input{max-width:100%;margin-top:10px}.csv-bad{color:var(--bad)}.csv-good{color:var(--ok)}
.csv-table{overflow:auto;max-height:370px;border:1px solid var(--line);border-radius:10px}
.csv-table table{border-collapse:collapse;width:100%;font-size:13px}.csv-table th,.csv-table td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.csv-table th{position:sticky;top:0;background:var(--surface2)}
.csv-chart{width:100%;height:190px;display:block;background:var(--surface2);border-radius:12px}.csv-find{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.csv-find b{display:block}.csv-find small{color:var(--ink2)}

/* ---------- Diagnóstico OBD2 ---------- */
.obd-kpi b i{font-style:normal}.obd-kpi.ob-warn{border-color:var(--warn-bar,#d9a400);background:var(--warn-soft,var(--surface2))}.obd-kpi.ob-bad{border-color:var(--bad-bar);background:var(--bad-soft,var(--surface2))}.obd-log{white-space:pre-wrap;font:12px/1.5 var(--f-mono,monospace);max-height:260px;overflow:auto;margin:10px 0 0}
.obd-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));margin-top:16px}
.obd-kpi{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.obd-kpi span{display:block;color:var(--ink2);font-size:13px;font-weight:600}
.obd-kpi b{display:block;font:700 34px var(--f-disp);line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.obd-kpi small{color:var(--ink2)}
.obd-status{display:flex;align-items:center;gap:9px;font-weight:600}
.obd-led{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.obd-led.on{background:var(--ok-bar);box-shadow:0 0 0 4px var(--ok-soft)}
.obd-led.err{background:var(--bad-bar)}
.obd-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.obd-select{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:min(100%,260px)}
.obd-log{font:12px var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--dash);color:var(--dash-ink);border-radius:10px;padding:12px;max-height:190px;overflow:auto}
.obd-note{font-size:13px;color:var(--ink2);line-height:1.45}
@media(min-width:960px){.tabbar{grid-template-columns:repeat(6,1fr)}}

/* ---------- Estrutura ---------- */
#app{min-height:100%}
.side{display:none}
.page{
  max-width:1160px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;
}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;letter-spacing:.01em}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.vsel{max-width:210px;min-height:40px;padding:0 30px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;font-weight:500;text-overflow:ellipsis}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.flat{border-color:transparent;background:transparent;width:36px;height:36px}
.dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad-bar);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.danger{background:var(--bad-bar);border-color:var(--bad-bar);color:#fff}
.hide-m{display:none}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;height:52px;padding:0 20px;border-radius:26px;box-shadow:var(--shadow)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--ink2);font-size:11.5px;font-weight:500;min-width:0}
.tabbar a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tabbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

@media (min-width:960px){
  #app{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .side{display:block;background:var(--surface);border-right:1px solid var(--line)}
  .side-in{position:sticky;top:0;padding:24px 16px;display:flex;flex-direction:column;gap:22px;min-height:100vh}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--dash);color:var(--oil2);display:grid;place-items:center}
  .brand b{font-family:var(--f-disp);font-size:26px;font-weight:700;line-height:1}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;font-weight:500;color:var(--ink2)}
  .side nav a:hover{background:var(--surface2)}
  .side nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side-foot{margin-top:auto;font-size:13px;color:var(--ink2);line-height:1.4}
  .tabbar,.fab{display:none}
  .hide-m{display:inline-flex}
  .page{padding-block:0 56px}
  .top{padding-block:24px 14px}
  .top h1{font-size:38px}
}
.brand{display:none}
@media (min-width:960px){.brand{display:flex}}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-family:var(--f-disp);font-size:22px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;background:var(--cs);color:var(--c);font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cb)}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.l0{--c:var(--ok);--cs:var(--ok-soft);--cb:var(--ok-bar)}
.l1{--c:var(--warn);--cs:var(--warn-soft);--cb:var(--warn-bar)}
.l2{--c:var(--urgent);--cs:var(--urgent-soft);--cb:var(--urgent-bar)}
.l3{--c:var(--bad);--cs:var(--bad-soft);--cb:var(--bad-bar)}
.lx{--c:var(--ink2);--cs:var(--surface2);--cb:var(--line)}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cb);border-radius:3px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line);gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--ink2);min-height:36px}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:13.5px;font-weight:500;color:var(--ink2);min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px}
.proto{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px;margin-bottom:16px}
.proto button{background:none;border:0;text-decoration:underline;font-weight:600;color:var(--accent);padding:4px}
.stack-grid{display:grid;gap:16px}

/* Painel */
.grid-p{display:grid;gap:16px;grid-template-areas:"hero" "odo" "alerts" "next" "docs" "recent";min-width:0}
.grid-p>*{min-width:0}
.a-hero{grid-area:hero}.a-odo{grid-area:odo}.a-alerts{grid-area:alerts}.a-next{grid-area:next}.a-docs{grid-area:docs}.a-recent{grid-area:recent}
@media (min-width:960px){
  .grid-p{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"hero odo" "alerts next" "alerts docs" "recent recent";align-items:start}
}
.hero{position:relative;overflow:hidden}
.hero .big{font-family:var(--f-disp);font-weight:700;font-size:clamp(56px,13vw,84px);line-height:.95;color:var(--c);letter-spacing:.005em}
.hero .big small{font-size:.38em;font-weight:600;color:var(--ink2);margin-left:6px;letter-spacing:.04em}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:14px}
.hero-meta span{display:block;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.dip{display:block;width:100%;max-width:520px;height:auto;margin-top:14px}
.dip-ring{fill:none;stroke:var(--dip-line);stroke-width:3}
.dip-body{fill:var(--dip-body);stroke:var(--dip-line);stroke-width:1.5}
.dip-tick{stroke:var(--ink2);stroke-width:1.5}
.dip-t{font:600 11px var(--f-body);fill:var(--ink2);letter-spacing:.08em}
.dip-mark{fill:var(--ink)}
.hatch{fill:var(--dip-line);opacity:.55}
.odo{display:flex;align-items:center;gap:4px}
.odo .dg{width:34px;height:50px;display:grid;place-items:center;background:var(--dash);color:var(--dash-ink);font:500 30px var(--f-mono);border-radius:5px;box-shadow:inset 0 -10px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.odo .dg.last{background:#8A5B00;color:#fff}
.odo small{font:600 14px var(--f-body);color:var(--ink2);margin-left:6px}
.odo-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:14px}
.odo-meta b{font-family:var(--f-disp);font-size:22px;font-weight:600;display:block;line-height:1.1}
.spark{display:block;width:100%;height:56px;margin-top:12px}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--accent-soft);stroke:none}
.spark circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.sumbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-bottom:10px}
.sumbar i{display:block;background:var(--cb);min-width:6px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;margin-bottom:14px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cb);margin-right:6px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.arow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0;padding-top:4px}
.arow h3{font-size:16px;font-weight:600;line-height:1.2}
.arow .sub{font-size:13px;color:var(--ink2)}
.arow .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.arow .ms{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.arow{grid-template-columns:40px minmax(0,1fr)}.arow .act{grid-column:2 / -1;justify-content:flex-start}.tl li{grid-template-columns:48px minmax(0,1fr)}.tl .r{grid-column:2 / -1;text-align:left}}
.arow .pb{grid-column:2 / -1}
.m{background:var(--cs);color:var(--c);border-radius:10px;padding:6px 10px;min-width:0;flex:1 1 130px}
.m b{display:block;font-family:var(--f-disp);font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.m span{display:block;font-size:12.5px;color:var(--ink2)}
.empty{padding:22px 10px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-family:var(--f-disp);font-size:22px;color:var(--ink);font-weight:600}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .d{text-align:center;line-height:1;font-family:var(--f-disp);background:var(--cs);color:var(--c);border-radius:8px;padding:6px 0}
.tl .d b{display:block;font-size:22px;font-weight:700}
.tl .d span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-body);font-weight:600}
.tl h3{font-size:15px;font-weight:600;line-height:1.2}
.tl small{color:var(--ink2);font-size:13px}
.tl .r{font-size:13px;color:var(--ink2);text-align:right}

/* Manutenções */
.group-h{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.prow.off{opacity:.72}
.prow-h{display:flex;gap:12px;align-items:center}
.prow-h .g{min-width:0;flex:1}
.prow-h b{display:block;font-weight:600;line-height:1.2}
.prow-h small{color:var(--ink2);font-size:13px}
.prow-i{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.prow-i label{display:flex;align-items:center;gap:6px}
.prow-i input{width:92px}
.prow-i input.mo{width:64px}
.prow-n{font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.prow-n b{color:var(--ink);font-weight:600}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0}
.yh{font-family:var(--f-disp);font-size:20px;font-weight:600;margin:18px 0 8px;color:var(--ink2)}
.rec{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rec-d{text-align:center;font-family:var(--f-disp);line-height:1;background:var(--surface2);border-radius:10px;padding:8px 0;align-self:start}
.rec-d b{display:block;font-size:26px;font-weight:700}
.rec-d span{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);font-weight:600;font-family:var(--f-body)}
.rec-m{min-width:0;display:flex;flex-direction:column;gap:6px}
.rec-m .chips{gap:6px}
.rchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--ink);padding:3px 10px 3px 8px;border-radius:8px;font-size:13.5px;font-weight:500}
.rchip .ic{width:15px;height:15px;color:var(--accent)}
.rec .meta{font-size:14px;color:var(--ink2);display:flex;gap:4px 12px;flex-wrap:wrap}
.rec .meta b{color:var(--ink);font-weight:600}
.rec .note{font-size:14px}
.rec-a{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.rec-a .btn{white-space:normal}
@media (max-width:520px){
  .rec{grid-template-columns:48px minmax(0,1fr)}
  .rec-a{grid-column:1 / -1;flex-direction:row;justify-content:flex-end}
}

/* Custos */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink2);font-size:13px}
.cols2{display:grid;gap:16px;margin-top:16px}
@media (min-width:960px){.cols2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:200px;padding-top:6px;
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
.bars .c{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;min-width:0}
.bars .v{font-size:11px;color:var(--ink2);margin-bottom:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bars .b{width:100%;max-width:34px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.bars .c.z .b{background:var(--line)}
.bars .c.mx .b{background:var(--oil)}
.mlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink2);text-align:center}
.hb{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.hb .bar{height:10px}
.hb .bar i{background:var(--accent)}
.hb b{font-variant-numeric:tabular-nums;font-weight:600}
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.toplist li:first-child{border-top:0}
.toplist small{display:block;color:var(--ink2)}
.toplist b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Carro */
.car-head{display:grid;gap:18px;align-items:center}
@media (min-width:720px){.car-head{grid-template-columns:minmax(0,300px) minmax(0,1fr)}}
.car-art{color:var(--ink2);background:var(--surface2);border-radius:14px;padding:16px 10px 8px}
.car-art svg{display:block;width:100%;height:auto}
.plate{display:inline-flex;flex-direction:column;align-items:stretch;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;color:#111;min-width:150px}
.plate i{background:#1D4FB8;color:#fff;font:600 10px var(--f-body);font-style:normal;letter-spacing:.2em;text-align:center;padding:2px 0}
.plate b{font:500 28px var(--f-mono);letter-spacing:.08em;text-align:center;padding:2px 12px 4px;text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 18px;margin-top:14px}
.facts span{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.facts b{font-weight:600}
.fgrp{margin-top:18px}
.fgrp h3{font-family:var(--f-disp);font-size:20px;font-weight:600;margin-bottom:10px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--ink2);min-width:0}
label.f.full{grid-column:1 / -1}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px;font-weight:400;min-width:0}
textarea{min-height:76px;resize:vertical}
select{appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.prow-i input[type=number]{min-height:38px;padding:5px 8px;font-size:15px}
.vlist{display:grid;gap:8px;margin-top:10px}
.vitem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.vitem[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.vitem b{font-weight:600}
.vitem small{display:block;color:var(--ink2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

/* Ajustes */
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .t{min-width:0}
.srow b{display:block;font-weight:600}
.srow small{color:var(--ink2);font-size:13.5px;display:block}
.srow input[type=number],.srow input[type=time],.srow select{width:130px;flex:none}
.notif{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;max-width:420px}
.notif .app{width:36px;height:36px;border-radius:9px;background:var(--dash);color:var(--oil2);display:grid;place-items:center;flex:none}
.notif b{display:block;font-size:14px}
.notif p{font-size:14px}
.notif small{color:var(--ink2);font-size:12px}
.set-grid{display:grid;gap:16px}
@media (min-width:960px){.set-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}

/* Modal e toast */
.ov{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:end center;overscroll-behavior:contain}
.sheet{background:var(--surface);width:min(680px,100%);max-height:94%;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:720px){.ov{place-items:center}.sheet{border-radius:20px;max-height:90%;padding:24px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font-family:var(--f-disp);font-size:28px;font-weight:700;line-height:1}
.chkgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
label.chk{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14.5px;min-height:44px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
label.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.chk small{display:block;color:var(--ink2);font-size:12px}
.preview{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.preview div{display:flex;justify-content:space-between;gap:12px}
.preview div span:last-child{text-align:right;color:var(--ink2)}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px}
.ta-export{font:13px var(--f-mono);min-height:240px}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){#toast{bottom:28px}}
#push{position:fixed;left:50%;transform:translate(-50%,-30px);top:calc(12px + env(safe-area-inset-top,0px));z-index:80;width:min(420px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#push.show{opacity:1;transform:translate(-50%,0)}
#push .notif{background:var(--surface);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Sugestão de óleo e câmbio */
.sug-grid{display:grid;gap:14px;margin-top:14px}
@media (min-width:760px){.sug-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sug{background:var(--surface2);border-radius:14px;padding:16px;min-width:0}
.sug-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sug-big{font-family:var(--f-disp);font-weight:700;font-size:56px;line-height:1;margin:10px 0 6px;color:var(--ink)}
.sug-big.sm{font-size:26px;line-height:1.15;margin:12px 0 6px;overflow-wrap:anywhere}
.sug-spec{font-weight:500;color:var(--ink2);font-size:14.5px;overflow-wrap:anywhere}
.sug-dl{margin:12px 0 0;display:grid;gap:8px}
.sug-dl div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;font-size:14px;padding-top:8px;border-top:1px dashed var(--line)}
.sug-dl dt{color:var(--ink2);margin:0}
.sug-dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sug-notes{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.sug-notes li{display:flex;gap:10px;font-size:14px}
.sug-notes li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.sug-src{font-size:14.5px;margin-top:2px}
.sug-vers{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug-disc{margin-top:14px;font-size:13px;color:var(--ink2)}
@media (max-width:420px){.sug-dl div{grid-template-columns:1fr;gap:2px}}
</style>

</head>

  '<path class="dip-mark" d="M'+lx+' 50l-6 10h12z"/></svg>';

function metrics(s){
  let h='';
  if(s.dueKm!=null){const o=s.remKm<0;h+='<div class="m l'+s.lk+'"><b>'+fmt(Math.abs(s.remKm))+' km</b><span>'+(o?'além do limite':'restantes')+' · '+fmt(s.dueKm)+' km</span></div>'}
  if(s.dueDate){const d=s.remDays,o=d<0;h+='<div class="m l'+s.lt+'"><b>'+(d===0?'Hoje':daysTxt(d))+'</b><span>'+(o?'em atraso':'restantes')+' · '+fdate(s.dueDate)+'</span></div>'}
  return h;
}
function lastTxt(s){return s.last?'Última: '+fdate(parse(s.last.date))+' · '+fmt(s.last.km)+' km':'Sem registro · contado desde a compra'}
function alertRow(s){
  const w=Math.max(3,Math.min(100,s.pct*100));
  return '<div class="arow l'+s.level+'"><span class="ib">'+ic(s.it.ic)+'</span>'+
   '<div style="min-width:0"><h3>'+esc(s.it.n)+'</h3><div class="sub">'+esc(lastTxt(s))+'</div></div>'+
   '<div class="act"><span class="pill">'+LV[s.level]+'</span><button class="btn ghost sm" data-act="rec-new" data-items="'+s.it.id+'">Registrar</button></div>'+
   '<div class="ms">'+metrics(s)+'</div>'+
   '<div class="pb"><div class="bar" role="progressbar" aria-valuenow="'+Math.round(Math.min(100,s.pct*100))+'" aria-valuemin="0" aria-valuemax="100" aria-label="Desgaste do intervalo"><i style="width:'+w+'%"></i></div></div></div>';

function spark(v){
  const lim=addDays(TODAY,-365),rs=readings(v).filter(r=>parse(r.date)>=lim);
  if(rs.length<2)return '';
  const W=300,H=56,pd=6,t0=parse(rs[0].date).getTime(),t1=parse(rs[rs.length-1].date).getTime()||t0+1;
  const kmin=rs[0].km,kmax=rs[rs.length-1].km||kmin+1;
  const pts=rs.map(r=>[pd+(parse(r.date).getTime()-t0)/Math.max(1,t1-t0)*(W-2*pd),H-pd-(r.km-kmin)/Math.max(1,kmax-kmin)*(H-2*pd)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Evolução do odômetro nos últimos 12 meses"><path class="area" d="'+d+'L'+last[0]+' '+H+'L'+pts[0][0]+' '+H+'z"/><path d="'+d+'"/></svg>';
}

/* Abastecimentos: dados por veículo, persistidos junto com o backup JSON. */
function fuelEntries(v){return (v.fuelEntries||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.km-b.km)}
function fuelStats(v){
 const all=fuelEntries(v),totalL=all.reduce((a,x)=>a+Number(x.liters||0),0),totalR=all.reduce((a,x)=>a+Number(x.cost||0),0);
 let distance=0,liters=0,spent=0,segments=0,anchor=null,bucket=[];
 for(const x of all){
   if(anchor && x.km<=anchor.km){if(x.full){anchor=x;bucket=[]}continue}
   if(anchor)bucket.push(x);
   if(x.full){
     if(anchor && x.km>anchor.km){const l=bucket.reduce((a,b)=>a+Number(b.liters||0),0),r=bucket.reduce((a,b)=>a+Number(b.cost||0),0);if(l>0){distance+=x.km-anchor.km;liters+=l;spent+=r;segments++}}
     anchor=x;bucket=[];
   }
 }
 return {all,totalL,totalR,distance,liters,spent,segments};
}

 const f=fuelStats(v),num=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2});
 const maint=v.records.reduce((a,r)=>a+(Number(r.cost)||0),0);
 const range=Math.max(0,curKm(v)-(Number(v.initialKm)||0));
 const combined=maint+f.totalR;
 return '<section class="card" style="margin-top:6px"><div class="card-h"><h2>Abastecimento e consumo</h2><button class="btn sm" data-act="fuel-new">'+ic('plus')+' Novo abastecimento</button></div>'+
 '<p class="muted" style="margin-bottom:12px">Registre o odômetro e os litros. Para medir km/L com precisão, marque tanque cheio no início e no fim de cada intervalo. Abastecimentos parciais intermediários entram na conta.</p>'+
 '<div class="kpis"><div class="kpi"><span class="eyebrow">Consumo médio medido</span><b>'+(f.liters>0?num(f.distance/f.liters)+' km/L':'—')+'</b><small>'+(f.segments?num(f.distance)+' km medidos':'Aguardando dois tanques cheios')+'</small></div>'+
 '<div class="kpi"><span class="eyebrow">Combustível / km</span><b>'+(f.distance>0?brl.format(f.spent/f.distance):'—')+'</b><small>Nos intervalos medidos</small></div>'+
 '<div class="kpi"><span class="eyebrow">Total abastecido</span><b>'+brl.format(f.totalR)+'</b><small>'+num(f.totalL)+' litros · '+f.all.length+' registros</small></div>'+
 '<div class="kpi"><span class="eyebrow">Custo total registrado</span><b>'+brl.format(combined)+'</b><small>Combustível + manutenção</small></div></div>'+
 '<p class="muted" style="margin-top:12px">Custo combinado por km desde a compra: <b>'+(range>0?brl.format(combined/range):'—')+'</b>. Esse indicador considera apenas os gastos cadastrados; para uma média histórica completa, registre todas as despesas do período.</p>'+
 (f.all.length?'<div style="overflow-x:auto;margin-top:14px"><table style="width:100%;border-collapse:collapse;text-align:left;font-size:13px"><thead><tr><th>Data</th><th>Odômetro</th><th>Litros</th><th>Valor</th><th>Tipo</th><th>Ações</th></tr></thead><tbody>'+f.all.slice().reverse().map(x=>'<tr style="border-top:1px solid var(--line)"><td>'+fdate(parse(x.date))+'</td><td>'+fmt(x.km)+' km</td><td>'+num(x.liters)+' L</td><td>'+brl.format(x.cost)+'</td><td>'+(x.full?'Cheio':'Parcial')+'</td><td><button class="btn ghost sm" data-act="fuel-edit" data-id="'+esc(x.id)+'">Editar</button> <button class="btn ghost sm" data-act="fuel-del" data-id="'+esc(x.id)+'">Excluir</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum abastecimento cadastrado.</div>')+'</section>';
}

 if(other.some(x=>x.km===km)){err.textContent='Já existe abastecimento com esse odômetro. Corrija ou edite o registro.';return}

 const g=obGroups(await obCmd('0101'));let b=null;for(const gr of g){const i=gr.findIndex((x,j)=>x===0x41&&gr[j+1]===1);if(i>=0){b=gr.slice(i+2);break}}
 if(!b||b.length<4)return null;
 const A=b[0],B=b[1],C=b[2],D=b[3],diesel=!!(B&8);const mon=[];
 [['Falhas de ignição (misfire)',0],['Sistema de combustível',1],['Componentes abrangentes',2]].forEach(m=>{if(B&(1<<m[1]))mon.push({n:m[0],done:!(B&(1<<(m[1]+4)))})});
 const names=diesel?[['Catalisador NMHC',0],['Pós-tratamento NOx/SCR',1],['Pressão de turbo',3],['Sensor de gases de escape',5],['Filtro de partículas (DPF)',6],['EGR/VVT',7]]:[['Catalisador',0],['Catalisador aquecido',1],['Sistema EVAP',2],['Ar secundário',3],['Ar-condicionado',4],['Sondas lambda',5],['Aquecedor das sondas',6],['EGR/VVT',7]];
 names.forEach(m=>{if(C&(1<<m[1]))mon.push({n:m[0],done:!(D&(1<<m[1]))})});
 OBX.ready={mil:!!(A&128),count:A&127,diesel:diesel,mon:mon};return OBX.ready;
}
/* ---------- informações do veículo ---------- */
async function obReadVehicleInfo(){
 const txt=bytes=>bytes.map(c=>c>31&&c<127?String.fromCharCode(c):'').join('').trim();
 try{const g=obGroups(await obCmd('0902',8000));for(const gr of g){const i=gr.findIndex((x,j)=>x===0x49&&gr[j+1]===2);if(i>=0){const s=txt(gr.slice(i+3));const m=s.match(/[A-HJ-NPR-Z0-9]{17}/);if(m){OBX.vin=m[0];break}}}}catch(e){}
 try{const g=obGroups(await obCmd('0904',8000));for(const gr of g){const i=gr.findIndex((x,j)=>x===0x49&&gr[j+1]===4);if(i>=0){OBX.cal=txt(gr.slice(i+3)).replace(/\s+/g,' ');break}}}catch(e){}
}
/* ---------- diagnóstico automático ---------- */
function obFindings(){
 const f=[],V=OBX.vals,D=OBX.dtc,R=OBX.ready,run=V.rpm>400;
 const add=(lvl,t,b)=>f.push({lvl:lvl,t:t,b:b});
 if(D){D.stored.concat(D.perm).filter((c,i,a)=>a.indexOf(c)===i).forEach(c=>{const i=obDtcInfo(c);add(i.u,c+' · '+i.d,'Verificar: '+i.c+'.')});D.pending.forEach(c=>{if(D.stored.indexOf(c)<0){const i=obDtcInfo(c);add(Math.min(2,i.u),c+' (pendente) · '+i.d,'Ainda não confirmado: '+i.c+'.')}})}
 else add(0,'Falhas não lidas','Abra a aba “Falhas” e toque em “Ler falhas” para incluir os códigos no relatório.');
 if(R&&R.mil)add(2,'Luz de injeção (MIL) acesa','A central registrou falha que afeta emissões ou funcionamento.');
 if(R){const inc=R.mon.filter(m=>!m.done);if(inc.length)add(1,'Monitores de prontidão incompletos ('+inc.length+')',inc.map(m=>m.n).join(', ')+'. Normal logo após apagar falhas ou trocar bateria; complete o ciclo de condução antes da inspeção.')}
 if(V.volt!=null){if(run&&V.volt<13.0)add(2,'Tensão baixa com motor ligado ('+obFmt('volt',V.volt)+' V)','Esperado 13,5–14,7 V. Verifique alternador, correia e cabos da bateria.');else if(run&&V.volt>15.0)add(2,'Tensão alta com motor ligado ('+obFmt('volt',V.volt)+' V)','Possível regulador do alternador com defeito; risco para bateria e eletrônica.');else if(!run&&V.volt<12.0)add(2,'Bateria descarregada ('+obFmt('volt',V.volt)+' V)','Com motor desligado, abaixo de 12,0 V indica bateria fraca ou consumo parasita.')}
 else if(OBX.voltAT!=null){if(OBX.voltAT<12.0)add(2,'Tensão da bateria baixa ('+obFmt('volt',OBX.voltAT)+' V)','Medido pelo adaptador na tomada OBD.')}
 if(V.coolant!=null){if(V.coolant>108)add(3,'Motor superaquecendo ('+Math.round(V.coolant)+' °C)','Pare com segurança. Verifique nível do líquido, ventoinha, bomba e termostato.');else if(V.coolant>102)add(2,'Temperatura do motor elevada ('+Math.round(V.coolant)+' °C)','Acompanhe; confira ventoinha e nível do líquido.');else if(V.runtime>900&&V.coolant<70)add(1,'Motor não atinge temperatura ('+Math.round(V.coolant)+' °C após '+Math.round(V.runtime/60)+' min)','Possível termostato preso aberto (aumenta consumo e desgaste).')}
 [['ltft1','LTFT B1'],['ltft2','LTFT B2']].forEach(p=>{const v=V[p[0]];if(v!=null&&Math.abs(v)>10)add(Math.abs(v)>15?2:1,'Correção longa de combustível '+(v>0?'positiva':'negativa')+' ('+obFmt(p[0],v)+' %)',v>0?'Mistura pobre compensada pela central: entrada falsa de ar, MAF sujo, pressão de combustível baixa ou bicos sujos.':'Mistura rica compensada: bicos vazando, regulador de pressão, MAF ou sonda.')});
 if(V.stft1!=null&&Math.abs(V.stft1)>15)add(1,'Correção curta oscilando muito ('+obFmt('stft1',V.stft1)+' %)','Verifique sonda lambda e vazamentos de admissão/escape.');
 if(V.map!=null&&V.rpm>0&&V.rpm<1000&&V.speed===0&&V.map>55)add(1,'Pressão no coletor alta em marcha lenta ('+Math.round(V.map)+' kPa)','Esperado ~25–45 kPa. Pode indicar atraso de ignição, escape restrito ou vazamento de vácuo.');
 if(V.load!=null&&V.rpm>0&&V.rpm<1000&&V.speed===0&&V.load>50)add(1,'Carga do motor alta em marcha lenta ('+Math.round(V.load)+' %)','Pode indicar admissão falsa, borboleta suja ou carga elétrica excessiva.');
 const ti=OBX.tst&&OBX.tst.idle,tw=OBX.tst&&OBX.tst.warm;
 if(ti&&!ti.invalid)ti.notes.forEach(n=>{if(ti.lvl>0)add(ti.lvl,'Teste de marcha lenta · irregularidade '+(Math.round(ti.cv*100)/100).toString().replace('.',',')+' %',n)});
 if(tw&&!tw.invalid&&!tw.inconclusive&&tw.lvl>0)add(tw.lvl,'Teste de aquecimento',tw.txt);
 const sev=f.reduce((a,x)=>a+(x.lvl===3?25:x.lvl===2?10:x.lvl===1?3:0),0);const score=Math.max(0,100-sev);
 return {items:f.sort((a,b)=>b.lvl-a.lvl),score:score};
}
function obSaveScan(){
 const v=V(),fi=obFindings(),strip=o=>o?JSON.parse(JSON.stringify(o)):null;
 const tests={idle:strip(OBX.tst.idle&&!OBX.tst.idle.invalid?OBX.tst.idle:null),warm:strip(OBX.tst.warm&&!OBX.tst.warm.invalid&&!OBX.tst.warm.inconclusive?OBX.tst.warm:null)};
 const sc={id:uid(),at:new Date().toISOString(),dtc:OBX.dtc?{stored:OBX.dtc.stored,pending:OBX.dtc.pending,perm:OBX.dtc.perm}:null,mil:OBX.ready?OBX.ready.mil:null,vin:OBX.vin||'',score:fi.score,vals:Object.assign({},OBX.vals),adapter:OBX.adapter,tests:tests,cond:{rpm:OBX.vals.rpm==null?null:OBX.vals.rpm,coolant:OBX.vals.coolant==null?null:OBX.vals.coolant},demo:OBX.kind==='sim'};
 v.scans=(v.scans||[]);v.scans.unshift(sc);v.scans=v.scans.slice(0,40);save();toast('Diagnóstico salvo no histórico do veículo.');render();
}
function obSyncOdo(){const v=V();const o=OBX.vals.odo;if(o==null)return;const km=Math.round(o);const date=new Date().toLocaleDateString('sv-SE');v.odo=(v.odo||[]).filter(r=>r.date!==date);v.odo.push({date:date,km:km});save();toast('Quilometragem do painel ('+fmt(km)+' km) registrada no app.');render()}
function obReportText(){
 const v=V(),fi=obFindings(),L=['MEU CARRO — RELATÓRIO DE DIAGNÓSTICO OBD2','Veículo: '+(v.nick||v.model||''),'Data: '+new Date().toLocaleString('pt-BR'),'Adaptador: '+OBX.adapter+(OBX.kind==='sim'?' (DEMONSTRAÇÃO – dados simulados)':''),OBX.vin?'VIN: '+OBX.vin:'','Saúde geral: '+fi.score+'/100',''];
 L.push('ACHADOS');fi.items.forEach(x=>L.push('['+['info','baixa','atenção','URGENTE'][x.lvl]+'] '+x.t+' — '+x.b));
 L.push('','VALORES');OB_PIDS.forEach(p=>{if(OBX.vals[p[1]]!=null)L.push(p[2]+': '+obFmt(p[1],OBX.vals[p[1]])+' '+p[3])});
 if(OBX.tst&&OBX.tst.idle&&!OBX.tst.idle.invalid){const r=OBX.tst.idle;L.push('','TESTE DE MARCHA LENTA','Rotação média '+Math.round(r.rpm)+' rpm · irregularidade '+r.cv.toFixed(2)+' % · quedas '+r.dips);r.notes.forEach(n=>L.push('- '+n))}
 if(OBX.tst&&OBX.tst.warm&&!OBX.tst.warm.invalid){const r=OBX.tst.warm;L.push('','TESTE DE AQUECIMENTO','Inicial '+Math.round(r.t0c)+' °C · trabalho '+Math.round(r.plateau)+' °C · pico '+Math.round(r.peak)+' °C','- '+r.txt)}
 if(OBX.mods&&OBX.mods.list.length){L.push('','OUTROS MÓDULOS');OBX.mods.list.forEach(m=>L.push('Módulo '+m.h+(obModLabel(m.h)?' ('+obModLabel(m.h)+')':'')+': '+(m.codes.length?m.codes.map(c=>c.code+(c.ftb?'-'+c.ftb:'')).join(', '):'sem falhas')))}
 L.push('','Análise automática de apoio; não substitui diagnóstico profissional.','© 2026 Adriel Fernando. Todos os direitos reservados.');return L.filter((x,i)=>x!==''||i>0).join('\n');
}

function obAct(a,el){

  case 'ob-ble':obConnect('ble');break;
  case 'ob-native':obConnect('native');break;

  case 'ob-play':obStartLive();break;
  case 'ob-pause':obStopLive();break;
  case 'ob-pids':obSelectModal();break;
  case 'ob-rec':obStartRec();break;
  case 'ob-rec-stop':obStopRec();break;
  case 'ob-rec-analyze':obAnalyzeRec();break;
  case 'ob-rec-csv':obDownload('gravacao-obd.csv',obRecCsv(OBX.lastRec),'text/csv;charset=utf-8');break;
  case 'ob-dtc':obReadDtc();break;
  case 'ob-clear':obAskClear();break;
  case 'ob-clear-yes':obClearDtc();break;
  case 'ob-ready':obReadReady().then(render).catch(()=>toast('Sem resposta da central'));break;
  case 'ob-save':obSaveScan();break;

  case 'ob-odo':obSyncOdo();break;
  case 'ob-vin':{const v=V();v.vin=OBX.vin;save();toast('VIN salvo na ficha.');render();break}
 }
}

function obClock(){return OBX.kind==='sim'&&OBX.simT?OBX.simT()*1000:Date.now()}
function obMean(a){return a.reduce((s,x)=>s+x,0)/a.length}
function obSd(a){const m=obMean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/a.length)}
function obPauseLive(){OBX.live=false;OBX.loopId++}
function obTstProg(pct,msg){if(OBX.tst.run){OBX.tst.run.pct=pct;OBX.tst.run.msg=msg}const b=$('#ob-tst-bar'),m=$('#ob-tst-msg');if(b)b.style.width=pct+'%';if(m)m.textContent=msg}
const obHex2=n=>('0'+n.toString(16)).slice(-2).toUpperCase();
function obDtcName(x){return 'PCBU'[x>>14]+((x>>12)&3)+('000'+(x&0xFFF).toString(16).toUpperCase()).slice(-3)}
/* Modo 06: contadores de falha de ignição por cilindro (MIDs A1–AC, TIDs 0B/0C) */
async function obRead06(){
 let sup=null;
 try{const g=obGroups(await obCmd('06A0',3000));for(const gr of g){const i=gr.findIndex((x,j)=>x===0x46&&gr[j+1]===0xA0);if(i>=0&&gr.length>=i+6){sup=gr.slice(i+2,i+6);break}}}catch(e){}
 if(!sup)return null;
 const m=(sup[0]*16777216)+(sup[1]*65536)+(sup[2]*256)+sup[3],cyl={};
 for(let c=1;c<=12;c++){if(Math.floor(m/Math.pow(2,32-c))%2!==1)continue;const mid=0xA0+c;
  try{const g=obGroups(await obCmd('06'+obHex2(mid),3000));
   for(const gr of g){const i=gr.findIndex((x,j)=>x===0x46&&gr[j+1]===mid);if(i<0)continue;let k=i+2;
    while(k+8<=gr.length){const tid=gr[k],tv=gr[k+2]*256+gr[k+3];if(tid===0x0B||tid===0x0C){cyl[c]=cyl[c]||{};cyl[c]['t'+obHex2(tid)]=tv}k+=8}}
  }catch(e){}}
 return Object.keys(cyl).length?cyl:null;
}
/* ---- teste de marcha lenta / falha de ignição ---- */
async function obTestIdle(){
 if(OBX.tst.run||!OBX.connected||!OBX.sup)return;
 const wasLive=OBX.live;obPauseLive();
 const R={type:'idle',pct:0,msg:'Lendo contadores de falha de ignição…'};OBX.tst.run=R;OBX.tst.idle=null;OBX.tab='tests';render();
 const keys=['rpm','speed','load','stft1','ltft1','map','maf','coolant'].filter(k=>OBX.sup.has(OB_BY_KEY[k][0]));
 try{
  const before=await obRead06().catch(()=>null);
  const D=30000,t0=obClock(),S=[];
  while(OBX.connected&&OBX.tst.run===R&&!R.abort){
   const el=obClock()-t0;if(el>=D&&S.length>=20)break;
   S.push(await obReadPids(keys));
   obTstProg(Math.min(99,Math.round(el/D*100)),'Medindo marcha lenta… '+Math.min(30,Math.round(el/1000))+' s');
   if(OBX.kind!=='sim')await obSleep(60);
  }
  if(R.abort||!OBX.connected){toast('Teste cancelado');return}
  obTstProg(100,'Lendo contadores finais…');
  const after=await obRead06().catch(()=>null);
  OBX.tst.idle=obIdleEval(S,before,after);
 }catch(e){obLog('Teste falhou: '+(e.message||e));toast('O teste foi interrompido')}
 finally{OBX.tst.run=null;if(wasLive&&OBX.connected)obStartLive();else render()}
}
function obIdleEval(S,b,a){
 const run=S.filter(x=>x.rpm!=null&&(x.speed==null||x.speed===0)),r={at:new Date().toISOString(),n:run.length,total:S.length};
 if(run.length<10||obMean(run.map(x=>x.rpm))<400){r.invalid=S.some(x=>x.speed>0)?'O carro estava em movimento. Faça o teste parado, em marcha lenta.':'Motor desligado ou sem leituras suficientes. Ligue o motor e mantenha em marcha lenta.';return r}
 const rp=run.map(x=>x.rpm),m=obMean(rp),med=rp.slice().sort((x,y)=>x-y)[Math.floor(rp.length/2)];
 r.rpm=m;r.cv=obSd(rp)/m*100;r.min=Math.min.apply(null,rp);r.max=Math.max.apply(null,rp);r.dips=rp.filter(x=>x<med*0.93).length;
 const avg=k=>{const q=run.map(x=>x[k]).filter(x=>x!=null);return q.length?obMean(q):null};
 r.load=avg('load');r.map=avg('map');r.stft=avg('stft1');r.ltft=avg('ltft1');r.coolant=avg('coolant');r.mis=null;
 if(b&&a){const rows=[];let tot=0;for(const c in a){const bb=b[c]||{},aa=a[c];const d=Math.max(0,(aa.t0B||0)-(bb.t0B||0),(aa.t0C||0)-(bb.t0C||0));rows.push({c:Number(c),d:d,before:bb,after:aa});tot+=d}r.mis={rows:rows,total:tot}}
 let lvl=0;if(r.cv>=2.5||r.dips>=4)lvl=3;else if(r.cv>=1.2||r.dips>=2)lvl=2;
 if(r.mis&&r.mis.total>=3)lvl=Math.max(lvl,3);else if(r.mis&&r.mis.total>0)lvl=Math.max(lvl,2);
 r.lvl=lvl;
 const bad=r.mis?r.mis.rows.filter(x=>x.d>0).sort((x,y)=>y.d-x.d):[],notes=[];
 if(bad.length===1)notes.push('Falhas concentradas no cilindro '+bad[0].c+' ('+bad[0].d+' ocorrências durante o teste): verifique vela, bobina/cabo e injetor desse cilindro e, se persistir, a compressão.');
 else if(bad.length>1)notes.push('Falhas em vários cilindros ('+bad.map(x=>'cil. '+x.c+': '+x.d).join(', ')+'): suspeite de causa comum — mistura (entrada de ar, pressão/filtro de combustível), velas vencidas ou combustível ruim.');
 if(r.ltft!=null&&r.ltft>8)notes.push('Correção longa positiva ('+r.ltft.toFixed(1).replace('.',',')+' %) indica mistura pobre: procure entrada falsa de ar e MAF sujo.');
 if(r.dips>=2&&!r.mis)notes.push('Quedas pontuais de rotação ('+r.dips+') sugerem falha de ignição intermitente. Este carro não informa contagem por cilindro: troque velas/bobinas de posição para isolar o cilindro.');
 if(r.coolant!=null&&r.coolant<70)notes.push('O motor ainda estava frio ('+Math.round(r.coolant)+' °C); a marcha lenta fria é naturalmente mais irregular. Repita com o motor quente (≥ 80 °C).');
 if(!notes.length)notes.push(lvl===0?'Marcha lenta estável, sem sinais de falha de ignição nesta medição.':'Irregularidade detectada, mas sem padrão claro. Repita o teste com o motor quente.');
 r.notes=notes;return r;
}
/* ---- teste de aquecimento / termostato ---- */
function obWarmDone(S){const T=S.length?S[S.length-1].t:0;if(T>=1500)return true;if(T<360)return false;const w=S.filter(x=>x.t>=T-180).map(x=>x.c);return w.length>20&&Math.max.apply(null,w)-Math.min.apply(null,w)<=4&&obMean(w)>=75}
async function obTestWarm(){
 if(OBX.tst.run||!OBX.connected||!OBX.sup)return;
 if(!OBX.sup.has(0x05)){toast('Este carro não informa a temperatura do motor');return}
 const wasLive=OBX.live;obPauseLive();if(OBX.simReset)OBX.simReset();
 const R={type:'warm',pct:0,msg:'Acompanhando a temperatura…',samples:[],t0:obClock()};OBX.tst.run=R;OBX.tst.warm=null;OBX.tab='tests';render();
 const keys=['coolant','rpm','speed','iat'].filter(k=>OBX.sup.has(OB_BY_KEY[k][0]));
 try{
  while(OBX.connected&&OBX.tst.run===R&&!R.stop&&!R.abort){
   const v=await obReadPids(keys),t=(obClock()-R.t0)/1000;
   if(v.coolant!=null){R.samples.push({t:t,c:v.coolant,rpm:v.rpm,speed:v.speed});obWarmPaint(R)}
   if(obWarmDone(R.samples))break;
   if(OBX.kind!=='sim')await obSleep(900);
  }
  if(R.abort||!OBX.connected){toast('Teste cancelado');return}
  OBX.tst.warm=obWarmEval(R.samples);
 }catch(e){obLog('Teste falhou: '+(e.message||e));toast('O teste foi interrompido')}
 finally{OBX.tst.run=null;if(wasLive&&OBX.connected)obStartLive();else render()}
}
function obWarmPaint(R){const S=R.samples,l=S[S.length-1],m=$('#ob-tst-msg');if(m)m.textContent='Motor a '+Math.round(l.c)+' °C · '+Math.floor(l.t/60)+' min '+Math.round(l.t%60)+' s';const c=$('#ob-warm-chart');if(c)c.innerHTML=obWarmChart(S)}
function obWarmChart(S){
 if(!S||S.length<2)return '';const w=300,h=130,T=Math.max(S[S.length-1].t,120),lo=20,hi=110;
 const X=t=>(t/T*(w-30)+26).toFixed(1),Y=c=>(h-14-((Math.min(hi,Math.max(lo,c))-lo)/(hi-lo))*(h-24)).toFixed(1);
 const pts=S.map(x=>X(x.t)+','+Y(x.c)).join(' ');
 const ref=[[80,'80°'],[95,'95°']].map(r=>'<line x1="26" x2="'+(w-4)+'" y1="'+Y(r[0])+'" y2="'+Y(r[0])+'" stroke="var(--line)" stroke-dasharray="3 3"/><text x="2" y="'+(Number(Y(r[0]))+3)+'" font-size="9" fill="var(--ink2)">'+r[1]+'</text>').join('');
 return '<svg viewBox="0 0 '+w+' '+h+'" class="csv-chart" role="img" aria-label="Temperatura do motor ao longo do tempo">'+ref+'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/><text x="26" y="'+(h-2)+'" font-size="9" fill="var(--ink2)">0</text><text x="'+(w-4)+'" y="'+(h-2)+'" font-size="9" text-anchor="end" fill="var(--ink2)">'+Math.round(T/60)+' min</text></svg>';
}
function obWarmEval(S){
 const r={at:new Date().toISOString(),n:S.length};
 if(S.length<5){r.invalid='Poucas leituras. Deixe o teste rodar por mais tempo.';return r}
 const T=S[S.length-1].t;r.dur=T;r.t0c=S[0].c;r.peak=Math.max.apply(null,S.map(x=>x.c));
 const first=th=>{const p=S.find(x=>x.c>=th);return p?p.t:null};r.t60=first(60);r.t70=first(70);r.t80=first(80);
 const w=S.filter(x=>x.t>=T-180);r.plateau=obMean(w.map(x=>x.c));r.amp=Math.max.apply(null,w.map(x=>x.c))-Math.min.apply(null,w.map(x=>x.c));
 const P=Math.round(r.plateau),min=Math.round(T/60);let lvl=0,txt;
 if(r.peak>108){lvl=3;txt='A temperatura chegou a '+Math.round(r.peak)+' °C: risco de superaquecimento. Pare o motor e verifique nível do líquido, ventoinha, bomba d’água e termostato.'}
 else if(T<300){txt='Teste curto demais para concluir. Continue por pelo menos 6–10 minutos, de preferência com o carro em movimento.';r.inconclusive=true}
 else if(r.t0c>=70){txt='O teste começou com o motor já quente ('+Math.round(r.t0c)+' °C), então só dá para avaliar a estabilidade: média de '+P+' °C, oscilação de '+r.amp.toFixed(0)+' °C.'+(r.amp>10?' A oscilação é alta: ventoinha ligando com frequência ou termostato instável.':'');if(r.amp>10)lvl=1}
 else if(r.plateau<76&&T>=600){lvl=2;txt='Após '+min+' min o motor ficou em '+P+' °C, abaixo da temperatura de trabalho. Suspeita de termostato preso aberto (aumenta consumo e desgaste) ou sensor de temperatura. Confirme também numa viagem.'}
 else if(r.plateau<76){txt='Ainda em '+P+' °C após '+min+' min. Continue o teste por mais alguns minutos antes de concluir.';r.inconclusive=true}
 else if(r.plateau>100){lvl=2;txt='Temperatura de trabalho alta ('+P+' °C). Verifique nível e estado do líquido, ventoinha, radiador e tampa do radiador.'}
 else if(r.amp>10){lvl=1;txt='A temperatura oscila '+r.amp.toFixed(0)+' °C depois de estabilizar ('+P+' °C em média): ventoinha acionando com frequência ou termostato instável.'}
 else txt='Aquecimento normal: chegou a 80 °C em '+(r.t80!=null?Math.round(r.t80/60*10)/10+' min':'—')+' e estabilizou em '+P+' °C.';
 r.lvl=lvl;r.txt=txt;return r;
}
/* ---- varredura de módulos (CAN 11 bits, somente leitura) ---- */
function obModProg(pct,msg){if(OBX.modRun){OBX.modRun.pct=pct;OBX.modRun.msg=msg}const b=$('#ob-mod-bar'),m=$('#ob-mod-msg');if(b)b.style.width=pct+'%';if(m)m.textContent=msg}
async function obProbe(h){
 try{await obCmd('ATSH'+h,1500)}catch(e){return null}
 const out={h:h,codes:[],kind:'',present:false};let g=[];
 try{g=obGroups(await obCmd('1902FF',1500))}catch(e){}
 for(const gr of g){
  const i=gr.findIndex((x,j)=>x===0x59&&gr[j+1]===2);
  if(i>=0){out.present=true;out.kind='UDS';let k=i+3;while(k+3<gr.length){const x=gr[k]*256+gr[k+1],st=gr[k+3];if(x||gr[k+2])out.codes.push({code:obDtcName(x),ftb:obHex2(gr[k+2]),conf:!!(st&8),pend:!!(st&4),act:!!(st&1),lamp:!!(st&128)});k+=4}}
  else{const j=gr.findIndex((x,q)=>x===0x7F&&gr[q+1]===0x19);if(j>=0){out.present=true;out.kind='UDS'}}
 }
 if(!out.codes.length){
  try{const l=await obCmd('03',1500),gg=obGroups(l);if(gg.some(x=>x.indexOf(0x43)>=0)){out.present=true;out.kind='OBD';obParseDtc(l,3).forEach(c=>out.codes.push({code:c,ftb:'',conf:true,pend:false,act:true,lamp:false}))}}catch(e){}
 }
 return out.present?out:null;
}
async function obScanModules(ext){
 if(OBX.modRun||!OBX.connected)return;
 const proto=String(OBX.proto||'').replace(/^A/,'');
 if(proto!=='6'&&proto!=='8'){toast('A varredura exige CAN de 11 bits; este carro usa o protocolo '+(proto||'desconhecido')+'.');return}
 const wasLive=OBX.live;obPauseLive();
 const list=[];for(let a=0x7E0;a<=0x7E7;a++)list.push(a.toString(16).toUpperCase());
 if(ext)for(let a=0x700;a<0x7DF;a++)list.push(a.toString(16).toUpperCase());
 const R={pct:0,msg:'Iniciando…'};OBX.modRun=R;OBX.tab='mods';render();
 const found=[];
 try{
  try{await obCmd('ATST19',1500)}catch(e){}
  for(let i=0;i<list.length&&OBX.modRun===R&&!R.abort&&OBX.connected;i++){obModProg(Math.round(i/list.length*100),'Consultando '+list[i]+' ('+(i+1)+'/'+list.length+')…');const r=await obProbe(list[i]);if(r)found.push(r)}
 }catch(e){obLog('Varredura falhou: '+(e.message||e))}
 finally{if(OBX.connected){try{await obCmd('ATSH7DF',1500)}catch(e){}try{await obCmd('ATST32',1500)}catch(e){}}
  OBX.mods={at:new Date().toISOString(),list:found,ext:!!ext};OBX.modRun=null;if(wasLive&&OBX.connected)obStartLive();else render()}
}
async function obReadModule(h){
 h=String(h||'').toUpperCase();if(!/^[0-9A-F]{3}$/.test(h)){toast('Informe o endereço com 3 dígitos hexadecimais (ex.: 7B0)');return}
 if(OBX.busy||OBX.modRun)return;const wasLive=OBX.live;obPauseLive();OBX.busy='Consultando '+h+'…';render();
 try{const r=await obProbe(h);try{await obCmd('ATSH7DF',1500)}catch(e){}
  OBX.mods=OBX.mods||{at:new Date().toISOString(),list:[]};OBX.mods.list=OBX.mods.list.filter(x=>x.h!==h);if(r)OBX.mods.list.push(r);else toast('O módulo '+h+' não respondeu.')}
 finally{OBX.busy='';if(wasLive&&OBX.connected)obStartLive();else render()}
}
function obModLabel(h){const v=V();const l=(v.modLabels||{})[h];if(l)return l;return h==='7E0'?'Motor (ECM)':h==='7E1'?'Câmbio (TCM)':''}
/* ---- histórico / tendência ---- */
const OB_HM=[
 ['ltft1','Correção longa de combustível (B1)','%',s=>s.vals&&s.vals.ltft1],
 ['stft1','Correção curta de combustível (B1)','%',s=>s.vals&&s.vals.stft1],
 ['volt','Tensão do módulo','V',s=>s.vals&&s.vals.volt],
 ['map','Pressão no coletor (MAP)','kPa',s=>s.vals&&s.vals.map],
 ['maf','Fluxo de ar (MAF)','g/s',s=>s.vals&&s.vals.maf],
 ['load','Carga do motor','%',s=>s.vals&&s.vals.load],
 ['idleCv','Irregularidade da marcha lenta','%',s=>s.tests&&s.tests.idle&&s.tests.idle.cv],
 ['misTotal','Falhas de ignição no teste','',s=>s.tests&&s.tests.idle&&s.tests.idle.mis?s.tests.idle.mis.total:null],
 ['warmPlat','Temperatura de trabalho','°C',s=>s.tests&&s.tests.warm&&s.tests.warm.plateau],
 ['warm70','Tempo até 70 °C','s',s=>s.tests&&s.tests.warm&&s.tests.warm.t70],
 ['score','Saúde geral','/100',s=>s.score]
];
function obSeries(key){const d=OB_HM.find(x=>x[0]===key);if(!d)return [];return (V().scans||[]).slice().reverse().map(s=>({s:s,v:d[3](s)})).filter(x=>x.v!=null&&Number.isFinite(x.v))}
function obTrend(key,ser){
 if(ser.length<2)return '';const a=ser[0].v,b=ser[ser.length-1].v,d=b-a,days=Math.max(1,Math.round((new Date(ser[ser.length-1].s.at)-new Date(ser[0].s.at))/864e5));
 const n=x=>String(Math.round(x*10)/10).replace('.',','),span=' em '+days+' dia(s)';
 if(key==='ltft1'||key==='stft1'){const A=Math.abs(a),B=Math.abs(b);if(B-A>=3&&B>=6)return 'A correção passou de '+n(a)+' % para '+n(b)+' %'+span+': a central está compensando cada vez mais. '+(b>0?'Antecipe a checagem de entrada falsa de ar, MAF e pressão de combustível.':'Verifique bicos, regulador de pressão e sonda.');if(A-B>=3)return 'A correção diminuiu de '+n(a)+' % para '+n(b)+' %'+span+' — melhora.'}
 if(key==='volt'&&a-b>=0.4)return 'A tensão caiu '+n(a-b)+' V'+span+'. Observe bateria e alternador antes de ficar na mão.';
 if(key==='idleCv'&&d>=1)return 'A marcha lenta ficou mais irregular'+span+' ('+n(a)+' % → '+n(b)+' %). Revise velas, bobinas e entrada de ar.';
 if(key==='warmPlat'&&Math.abs(d)>=6)return 'A temperatura de trabalho mudou '+n(d)+' °C'+span+'. '+(d<0?'Possível termostato começando a abrir fora de hora.':'Confira arrefecimento (nível, ventoinha, radiador).');
 if(key==='misTotal'&&d>0)return 'As falhas de ignição contadas aumentaram'+span+'.';
 if(key==='score'&&d<=-10)return 'A nota geral caiu '+n(-d)+' pontos'+span+'.';
 if(Math.abs(d)<0.02*Math.max(Math.abs(a),Math.abs(b),1))return 'Sem variação relevante entre os registros.';
 return 'Variação de '+n(d)+span+' (de '+n(a)+' para '+n(b)+'). Compare sempre em condições parecidas (motor quente, mesma rotação).';
}
function obHistChart(ser,unit){
 if(ser.length<2)return '';const w=300,h=130,vs=ser.map(x=>x.v);let lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);if(hi-lo<1e-6){hi=lo+1;lo=lo-1}const pad=(hi-lo)*0.15;lo-=pad;hi+=pad;
 const X=i=>(i/(ser.length-1)*(w-44)+34).toFixed(1),Y=v=>(h-16-((v-lo)/(hi-lo))*(h-30)).toFixed(1);
 const pts=ser.map((x,i)=>X(i)+','+Y(x.v)).join(' ');
 return '<svg viewBox="0 0 '+w+' '+h+'" class="csv-chart" role="img" aria-label="Evolução ao longo dos diagnósticos salvos"><text x="2" y="'+(Number(Y(vs[vs.length-1]))-6)+'" font-size="9" fill="var(--ink2)">'+esc(unit)+'</text><polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+ser.map((x,i)=>'<circle cx="'+X(i)+'" cy="'+Y(x.v)+'" r="3.2" fill="var(--accent)"/>').join('')+'</svg>';
}

function obWarmHtml(r){

function obAct2(a,el){

  case 'ob-t-idle':obTestIdle();return true;

  case 'ob-tst-cancel':if(OBX.tst.run){OBX.tst.run.abort=true}return true;
  case 'ob-tst-stop':if(OBX.tst.run)OBX.tst.run.stop=true;return true;
  case 'ob-mod-scan':obScanModules(false);return true;
  case 'ob-mod-scan-ext':obScanModules(true);return true;
  case 'ob-mod-cancel':if(OBX.modRun)OBX.modRun.abort=true;return true;
  case 'ob-mod-one':{const i=$('#ob-mod-h');obReadModule(i&&i.value);return true}
  case 'ob-scan-del':{const v=V();v.scans=(v.scans||[]).filter(s=>s.id!==el.dataset.id);save();render();return true}
 }
 return false;
}

function fichaAnoMotor(m,year){
 const all=(CATALOGO_INTEGRADO.fichasTecnicas||[]).filter(t=>t.marca===m?.marca&&t.modelo===m?.modelo);
 return all.filter(t=>!year||(Number(year)>=Number(t.anoInicio)&&Number(year)<=Number(t.anoFim)));
}
function exibirFichaModelo(m){
 const root=document.getElementById('cat-model-ficha');if(!root)return;
 if(!m){root.innerHTML='<p class="muted">Escolha um modelo e ano para consultar as fichas disponíveis.</p>';return;}
 const year=Number(document.getElementById('cat-year')?.value)||0;
 const all=fichaAnoMotor(m,0),fichas=fichaAnoMotor(m,year);
 const motorSel=document.getElementById('cat-engine');const selected=motorSel?.value||'';

function updatePreview(f){
  if(!f)return;
  const v=V(),fd=new FormData(f),date=fd.get('date'),km=Number(fd.get('km')),ids=fd.getAll('items'),box=$('#r-prev');

  box.innerHTML=ids.map(id=>{
    const it=ITEM[id],p=v.plan[id];
    if(!it)return '';
    if(!p||!p.on)return '<div><span>'+esc(it.n)+'</span><span>não acompanhado</span></div>';
    const k=ivKm(it,p),m=ivMo(it,p),parts=[];

function saveRecord(f){

  if(kmS===''||!(km>=0)){err.textContent='Informe o km do odômetro no dia do serviço.';return}

  const rec={id:id||uid(),date:date,km:km,items:items,other:other,cost:Number(fd.get('cost'))||0,cat:fd.get('cat'),shop:String(fd.get('shop')||'').trim(),prod:String(fd.get('prod')||'').trim(),notes:String(fd.get('notes')||'').trim()};

function saveOdo(f){
  const fd=new FormData(f),km=Number(fd.get('km')),date=fd.get('date'),err=$('#o-err'),v=V();
  if(!date||date>iso(TODAY)){err.textContent='Informe uma data válida, sem datas futuras.';return}
  const before=readings(v).filter(r=>r.date<=date).pop(),after=readings(v).filter(r=>r.date>date)[0];
  if(before&&km<before.km){err.textContent='O valor é menor que a leitura anterior ('+fmt(before.km)+' km em '+fdate(parse(before.date))+').';return}
  if(after&&km>after.km){err.textContent='O valor é maior que uma leitura posterior ('+fmt(after.km)+' km).';return}
  v.odo=(v.odo||[]).filter(r=>r.date!==date);v.odo.push({date:date,km:km});
  save();closeModal();render();toast('Odômetro atualizado para '+fmt(km)+' km');
}

function saveVeh(f){

  FIELDS.forEach(g=>g[1].forEach(fl=>{

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});

/* ================= Sugestão de óleo do motor e do câmbio (base offline) ================= */
let OLEOS=null;
const CF={a:2,m:1,b:0},CFN=['baixa','média','alta'];
const TIPO={manual:'Manual',at:'Automático',cvt:'CVT',dct:'Dupla embreagem',amt:'Automatizado',hev:'Híbrido',ev:'Redutor elétrico'};
const GPREF={'Manual':['manual'],'Automático':['at','cvt','dct','hev','amt'],'Automatizado':['amt','dct'],'CVT':['cvt','hev'],'Elétrico':['ev','hev']};
const GGEN={'Manual':'mt-generic','Automático':'at-generic','Automatizado':'dct-generic','CVT':'cvt-generic','Elétrico':'ev-reducer'};
const MK={vw:'volkswagen',gm:'chevrolet',chevy:'chevrolet','caoa chery':'chery',citroen:'citroen'};
const tok=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9.]+/g,' ').split(' ').map(x=>x.replace(/^\.+|\.+$/g,'')).filter(Boolean);
const normMake=s=>{const t=tok(s).join(' ');return MK[t]||t};
const isDisp=t=>/^\d\.\d$/.test(t);
function makeOk(a,b){return !a||!b||a===b||a.split(' ').indexOf(b)>=0||b.split(' ').indexOf(a)>=0}
function oleosInit(db){
  if(!db||!db.engines||!db.gearboxes||!Array.isArray(db.models)||!db.models.length)return false;
  db.models.forEach(m=>{m._k=[m.modelo].concat(m.alias||[]).map(tok);m._mk=normMake(m.marca)});
  OLEOS=db;return true;
}
try{oleosInit(JSON.parse($('#oleos-json').textContent))}catch(e){}

function findModel(v){
  const um=normMake(v.make),set=new Set(tok((v.model||'')+' '+(v.version||'')));
  let best=null,bs=0;
  OLEOS.models.forEach(m=>{
    if(!makeOk(um,m._mk))return;
    m._k.forEach(k=>{if(k.length&&k.every(t=>set.has(t))&&k.length>bs){bs=k.length;best=m}});
  });
  return best;
}
function pickVariant(m,v){
  const txt=new Set(tok([v.version,v.engine,v.power].join(' ')));
  const y=Number(v.yearModel)||Number(v.yearMfg)||0,ud=Array.from(txt).filter(isDisp);
  let best=null,bs=-99;
  m.v.forEach(x=>{
    const nt=tok(x.n);let s=0;
    nt.forEach(t=>{if(txt.has(t))s+=isDisp(t)?2:1});
    const d=nt.find(isDisp);
    if(d&&ud.length&&ud.indexOf(d)<0)s-=4;
    if(y){if(y>=x.a[0]&&y<=x.a[1])s+=2;else s-=3}
    if(s>bs){bs=s;best=x}
  });
  return{x:best,score:bs};
}
function pickGear(x,gt){
  const pref=GPREF[gt]||GPREF['Manual'];
  for(const t of pref){const id=x.c.find(i=>OLEOS.gearboxes[i]&&OLEOS.gearboxes[i].tipo===t);if(id)return{id:id,ok:true}}
  return{id:x.c[0],ok:false};
}
function genericSug(v){
  const txt=tok([v.version,v.engine,v.model,v.power].join(' ')),has=a=>a.some(t=>txt.indexOf(t)>=0);
  const ev=v.fuel==='Elétrico'||has(['eletrico','bev']);
  const hyb=v.fuel==='Híbrido'||has(['hibrido','hybrid','hev','phev']);
  const diesel=v.fuel==='Diesel'||has(['diesel','tdi','multijet','duramax','crdi','cdi']);
  const turbo=has(['turbo','tsi','tgdi','gdi','thp','tjet','tce','biturbo']);
  const G=OLEOS.generic||{};
  let eng=null,key='';
  if(!ev){key=hyb?'hibrido':diesel?'diesel':turbo?'gasolina-turbo':'gasolina-aspirado';eng=Object.assign({asp:turbo||diesel?'turbo':'aspirado',comb:v.fuel},G[key])}
  const gt=ev?'Elétrico':(v.gearbox||'Manual');
  const gid=GGEN[gt]||'mt-generic',gear=OLEOS.gearboxes[gid];
  return{origem:'regra',eng:eng,gear:gear,gearId:gid,engConf:0,gearConf:0,label:eng?eng.nome:'Veículo elétrico',x:null,m:null,gmiss:false,q:0};
}
function suggest(v){
  if(!OLEOS)return null;
  const gt=v.gearbox||'Manual',pk=UI.pk;
  if(pk.on&&pk.modelo){
    const m=OLEOS.models.find(z=>z.marca===pk.marca&&z.modelo===pk.modelo);
    if(m){
      const x=m.v[pk.vi]||m.v[0],gid=x.c[pk.gi]||x.c[0];
      return sugBuild(v,{origem:'escolha',m:m,x:x,q:2,gid:gid,gmiss:false});
    }
  }
  const m=findModel(v);
  if(!m)return genericSug(v);
  const p=pickVariant(m,v),g=pickGear(p.x,gt);
  const q=p.score>=3?2:p.score>=1?1:0;
  return sugBuild(v,{origem:'base',m:m,x:p.x,q:q,gid:g.id,gmiss:!g.ok});
}
function sugBuild(v,o){
  const eng=o.x.e?OLEOS.engines[o.x.e]:null,gear=OLEOS.gearboxes[o.gid];
  return{origem:o.origem,m:o.m,x:o.x,q:o.q,gmiss:o.gmiss,eng:eng,gear:gear,gearId:o.gid,
    engConf:eng?Math.min(CF[eng.conf],o.q):0,gearConf:Math.min(CF[gear.conf],o.q),
    label:o.m.marca+' '+o.m.modelo+' · '+o.x.n};
}
function sugNotes(v,s){
  const n=[],eng=s.eng,gear=s.gear,km=curKm(v);
  if(s.gmiss)n.push('O câmbio informado na ficha ('+(v.gearbox||'—')+') não aparece para esta versão na base. Mostrando: '+TIPO[gear.tipo]+'.');
  if(!eng)n.push('Veículo elétrico não usa óleo de motor. Só o redutor e o arrefecimento da bateria têm fluidos.');
  if(eng&&eng.asp==='turbo'&&eng.comb!=='diesel')n.push('Motor turbo: use óleo sintético com a aprovação indicada e não estique o intervalo.');
  if(eng&&eng.comb==='diesel')n.push('Diesel moderno com filtro de partículas (DPF) pede óleo de baixa cinza (ACEA C2/C3). Outro tipo entope o filtro.');
  if(eng&&eng.comb==='flex')n.push('Se você abastece com etanol e faz muitos trajetos curtos, o óleo sofre mais diluição. Fique no menor intervalo.');
  if(km>=100000)n.push('Com mais de 100.000 km, mantenha a viscosidade e a aprovação do manual. Óleo para alta quilometragem serve se tiver a mesma especificação.');
  if(S.settings.severe)n.push('Uso severo está ligado nos Ajustes: o intervalo de óleo e filtros já considera 30% a menos.');
  if(gear.tipo==='cvt'||gear.tipo==='hev')n.push('Câmbio CVT ou híbrido: nunca use ATF comum nem fluido genérico. Só o fluido da montadora.');
  if(gear.tipo==='dct'||gear.tipo==='amt')n.push('Câmbio de dupla embreagem ou automatizado: o fluido é específico e a troca deve ser feita em oficina que conheça o modelo.');
  if(gear.tipo==='at')n.push('Câmbio automático: o fabricante pode chamar o fluido de vida útil, mas trocar entre 40.000 e 60.000 km é prática comum para prolongar o câmbio.');
  if(eng&&eng.nota)n.push(eng.nota);
  if(gear.nota&&gear.tipo!=='at')n.push(gear.nota);
  return n;
}
function ivText(a){
  if(!a)return null;
  const km=a[0],mo=a[1],f=0.7,j=x=>x.filter(Boolean).join(' ou ');
  return{norm:j([km?fmt(km)+' km':'',mo?mo+' meses':'']),sv:j([km?fmt(Math.round(km*f/50)*50)+' km':'',mo?Math.max(1,Math.round(mo*f))+' meses':''])};
}
const confPill=c=>'<span class="pill l'+(2-c)+'">Confiança '+CFN[c]+'</span>';
const dlRow=(k,val)=>val?'<div><dt>'+k+'</dt><dd>'+esc(val)+'</dd></div>':'';

function pkHtml(){
  const k=UI.pk;
  const marcas=Array.from(new Set(OLEOS.models.map(m=>m.marca))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const ms=OLEOS.models.filter(m=>m.marca===k.marca).sort((a,b)=>a.modelo.localeCompare(b.modelo,'pt-BR'));
  const m=ms.find(z=>z.modelo===k.modelo),x=m&&(m.v[k.vi]||m.v[0]);
  const opt=(val,lab,sel)=>'<option value="'+esc(val)+'"'+(sel?' selected':'')+'>'+esc(lab)+'</option>';
  return '<div class="fgrid" style="margin-top:14px">'+
   '<label class="f">Marca<select id="pk-marca"><option value="">Selecione</option>'+marcas.map(z=>opt(z,z,z===k.marca)).join('')+'</select></label>'+
   '<label class="f">Modelo<select id="pk-modelo"><option value="">Selecione</option>'+ms.map(z=>opt(z.modelo,z.modelo,z.modelo===k.modelo)).join('')+'</select></label>'+
   (m?'<label class="f">Versão e motor<select id="pk-vi">'+m.v.map((z,i)=>opt(i,z.n+' ('+z.a[0]+'–'+z.a[1]+')',i===k.vi)).join('')+'</select></label>'+
   '<label class="f">Câmbio<select id="pk-gi">'+x.c.map((id,i)=>opt(i,TIPO[OLEOS.gearboxes[id].tipo]+' · '+OLEOS.gearboxes[id].nome,i===k.gi)).join('')+'</select></label>':'')+'</div>';
}
function sugCard(v){
  if(!OLEOS)return '<section class="card" id="sugestao" style="margin-top:16px"><div class="card-h"><h2>Óleo e fluidos recomendados</h2></div><div class="empty">A base de lubrificantes não foi carregada.</div></section>';
  const s=suggest(v),pk=UI.pk;
  const eiv=s.eng?ivText(s.eng.int):null,giv=ivText(s.gear.int);
  let src;
  if(s.origem==='regra')src='Modelo não encontrado na base. Mostrando a <b>regra geral</b> para '+(s.eng?esc(s.eng.nome.replace('Regra geral: ','')):'veículo elétrico')+'.';
  else src=(s.origem==='escolha'?'Veículo escolhido: ':'Encontrado na base: ')+'<b>'+esc(s.label)+'</b> ('+s.x.a[0]+'–'+s.x.a[1]+')'+(s.eng?' · Motor: '+esc(s.eng.nome):'')+'.';
  const partial=s.origem==='base'&&s.q<2?'<p class="sug-src" style="color:var(--warn)">Correspondência parcial com a ficha. Confira se a versão abaixo é a do seu carro, ou escolha outra.</p>':'';
  const vers=s.m&&(s.q<2||pk.on)?'<div class="sug-vers">'+s.m.v.map(z=>'<span class="tag">'+esc(z.n)+' · '+z.a[0]+'–'+z.a[1]+'</span>').join('')+'</div>':'';
  const ePanel=s.eng?
   '<div class="sug"><div class="sug-top"><span class="eyebrow">Óleo do motor</span>'+confPill(s.engConf)+'</div><div class="sug-big">'+esc(s.eng.visc)+'</div><p class="sug-spec">'+esc(s.eng.spec)+'</p><dl class="sug-dl">'+
    dlRow('Capacidade',s.eng.cap)+dlRow('Alternativa',s.eng.alt)+(eiv?dlRow('Troca (referência)',eiv.norm)+dlRow('Uso severo',eiv.sv):'')+'</dl></div>':
   '<div class="sug"><div class="sug-top"><span class="eyebrow">Óleo do motor</span></div><div class="sug-big sm">Não se aplica</div><p class="sug-spec">Veículo elétrico, sem motor a combustão.</p></div>';
  const gPanel='<div class="sug"><div class="sug-top"><span class="eyebrow">Câmbio · '+esc(TIPO[s.gear.tipo]||'')+'</span>'+confPill(s.gearConf)+'</div><div class="sug-big sm">'+esc(s.gear.fluido)+'</div><p class="sug-spec">'+esc(s.gear.spec)+'</p><dl class="sug-dl">'+
    dlRow('Transmissão',s.gear.nome)+dlRow('Capacidade',s.gear.cap)+(giv?dlRow('Troca (referência)',giv.norm)+dlRow('Uso severo',giv.sv):'')+'</dl></div>';
  const notes=sugNotes(v,s);
  const meta=OLEOS.meta||{};
  return '<section class="card" id="sugestao" style="margin-top:16px"><div class="card-h"><h2>Óleo e fluidos recomendados</h2><span class="muted" style="font-size:13px">Base offline · '+(meta.modelos||OLEOS.models.length)+' modelos · '+(meta.versoes||'')+' versões</span></div>'+
   '<p class="sug-src">'+src+'</p>'+partial+vers+
   (pk.on?pkHtml():'')+
   '<div class="sug-grid">'+ePanel+gPanel+'</div>'+
   '<ul class="sug-notes">'+notes.map(t=>'<li><span>'+esc(t)+'</span></li>').join('')+'</ul>'+
   '<div class="actions"><button class="btn" data-act="sug-apply">'+ic('check')+'Aplicar na ficha</button><button class="btn ghost" data-act="sug-apply-plan">Aplicar na ficha e no plano</button><button class="btn ghost" data-act="pk-toggle">'+(pk.on?'Voltar para a ficha':'Escolher outro veículo da base')+'</button></div>'+
   '<p class="sug-disc">Sugestão de referência, compilada para uso offline. Pode conter imprecisões. O manual do proprietário sempre prevalece. Trocar por viscosidade ou especificação diferente da prevista pode prejudicar o motor e a garantia.</p></section>';
}
function applySug(withPlan){
  const v=V(),s=suggest(v);if(!s)return;
  const cut=t=>String(t||'').replace(/^≈\s*/,'');
  if(s.eng){v.oilSpec=s.eng.visc+' · '+s.eng.spec;v.oilCap=cut(s.eng.cap)}
  v.gearOilSpec=s.gear.fluido+(s.gear.spec?' · '+s.gear.spec:'');v.gearOilCap=cut(s.gear.cap);
  if(withPlan){
    const set=(id,a)=>{if(!a)return;const p=v.plan[id]||(v.plan[id]={on:true,km:null,mo:null});p.on=true;p.km=a[0]||null;p.mo=a[1]||null};
    if(s.eng){set('oil',s.eng.int);set('oilf',s.eng.int)}
    if(s.gear.tipo!=='ev')set('gearoil',s.gear.int);
  }
  save();render();toast(withPlan?'Especificações e intervalos aplicados':'Especificações aplicadas à ficha');
}
function pkChange(t){
  const k=UI.pk;
  if(t.id==='pk-marca'){k.marca=t.value;k.modelo='';k.vi=0;k.gi=0}
  else if(t.id==='pk-modelo'){k.modelo=t.value;k.vi=0;k.gi=0}
  else if(t.id==='pk-vi'){k.vi=Number(t.value)||0;k.gi=0}
  else if(t.id==='pk-gi'){k.gi=Number(t.value)||0}
  render();
}
