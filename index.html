<script>
/* Catálogo unificado: FIPE v2 + fallback v1, sem chave no navegador. */
(function(){
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const v2='https://fipe.parallelum.com.br/api/v2',v1='https://parallelum.com.br/fipe/api/v1';
 const types={cars:'carros',motorcycles:'motos',trucks:'caminhoes'};
 const cache=new Map();let mode='v2',request=0,initialized=false;
 const st=x=>{if($('api-result'))$('api-result').textContent=x};
 const error=e=>/429/.test(e.message)?'Limite de consultas da API atingido (HTTP 429). Tente novamente mais tarde.':/abort/i.test(e.message)?'Tempo de resposta esgotado. Verifique a conexão e tente novamente.':e.message;
 async function fetchJson(url,refresh=false){if(!refresh&&cache.has(url))return cache.get(url);const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),16000);try{const r=await fetch(url,{signal:ctrl.signal,headers:{Accept:'application/json'},cache:refresh?'reload':'default'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d||typeof d!=='object')throw Error('Resposta inválida da API');cache.set(url,d);return d}finally{clearTimeout(t)}}
 function path(kind,b,m,y,which=mode){let p=which==='v2'?v2+'/'+kind:v1+'/'+types[kind];p+=which==='v2'?'/brands':'/marcas';if(b)p+='/'+encodeURIComponent(b)+(which==='v2'?'/models':'/modelos');if(m)p+='/'+encodeURIComponent(m)+(which==='v2'?'/years':'/anos');if(y)p+='/'+encodeURIComponent(y);return p}
 function items(d,which=mode){const arr=Array.isArray(d)?d:(Array.isArray(d?.modelos)?d.modelos:[]);return arr.map(x=>({code:String(x.code??x.codigo??''),name:String(x.name??x.nome??'')})).filter(x=>x.code&&x.name)}
 function fill(id,arr,placeholder){const e=$(id);if(!e)return;e.innerHTML='<option value="">'+esc(placeholder)+'</option>'+arr.map(x=>'<option value="'+esc(x.code)+'">'+esc(x.name)+'</option>').join('');e.disabled=!arr.length}
 async function load(level,refresh=false){const n=++request,k=$('api-type')?.value||'cars',b=$('api-brand')?.value,m=$('api-model')?.value;if(level===0){fill('api-brand',[],'Carregando marcas…');fill('api-model',[],'Selecione marca');fill('api-year',[],'Selecione modelo')}if(level===1){fill('api-model',[],'Carregando modelos…');fill('api-year',[],'Selecione modelo')}if(level===2)fill('api-year',[],'Carregando anos…');if(level===1&&!b||level===2&&(!b||!m))return;st('Consultando catálogo online…');try{let data;try{data=await fetchJson(path(k,level>=1?b:null,level>=2?m:null),refresh)}catch(e){if(level!==0||mode==='v1')throw e;mode='v1';data=await fetchJson(path(k,null,null,null,'v1'),refresh)}if(n!==request)return;const arr=items(data);if(!arr.length)throw Error('A API retornou uma lista vazia ou incompatível');fill(['api-brand','api-model','api-year'][level],arr,['Selecione a marca','Selecione o modelo','Selecione o ano'][level]);st('Dados carregados. '+(level===0?'Escolha a marca.':level===1?'Escolha o modelo e a versão.':'Selecione o ano e consulte a FIPE.')+' Fonte: FIPE ('+mode+').')}catch(e){if(n!==request)return;fill(['api-brand','api-model','api-year'][level],[],'Falha no carregamento');st('Não foi possível consultar: '+error(e)+'. Use “Atualizar dados da API” para tentar novamente.')}}
 function table(rows){return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:12px 0">'+rows.filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=='').map(([k,v])=>'<div style="padding:11px;border:1px solid var(--line,#374151);border-radius:10px"><small class="muted">'+esc(k)+'</small><div><b>'+esc(v)+'</b></div></div>').join('')+'</div>'}
 async function detail(){const k=$('api-type')?.value,b=$('api-brand')?.value,m=$('api-model')?.value,y=$('api-year')?.value;if(!b||!m||!y){st('Escolha categoria, marca, modelo e ano antes de consultar.');return}st('Consultando Tabela FIPE…');try{const d=await fetchJson(path(k,b,m,y));const rows=mode==='v2'?[['Marca',d.brand],['Modelo / versão',d.model],['Ano',d.modelYear],['Combustível',d.fuel],['Código FIPE',d.codeFipe],['Valor de referência',d.price],['Mês de referência',d.referenceMonth]]:[['Marca',d.Marca],['Modelo / versão',d.Modelo],['Ano',d.AnoModelo],['Combustível',d.Combustivel],['Código FIPE',d.CodigoFipe],['Valor de referência',d.Valor],['Mês de referência',d.MesReferencia]];$('api-result').innerHTML='<h3>Resultado da Tabela FIPE</h3>'+table(rows)+'<p class="muted">Fonte: API FIPE Parallelum. Não inclui ficha técnica de motor, óleo ou manutenção.</p>';}catch(e){st('Falha na consulta FIPE: '+error(e))}}
 document.addEventListener('change',e=>{if(e.target.id==='api-type'){mode='v2';load(0)}else if(e.target.id==='api-brand')load(1);else if(e.target.id==='api-model')load(2);else if(e.target.id==='api-year')st('Ano selecionado. Clique em “Consultar Tabela FIPE”.')});
 document.addEventListener('click',e=>{if(e.target.closest('#api-query'))detail();if(e.target.closest('#api-retry')){cache.clear();mode='v2';load(0,true)}});
 const observer=new MutationObserver(()=>{if($('api-brand')&&!initialized){initialized=true;mode='v2';load(0)}else if(!$('api-brand'))initialized=false});observer.observe(document.body,{childList:true,subtree:true});if($('api-brand')){initialized=true;load(0)}
})();
</script>
</body>
</html>
